{% extends 'base.html' %}

{% block title %}Buat Akun Baru - School App{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow border-0 p-3 rounded-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">Buat Akun 🚀</h2>
                    <p class="text-muted small">Daftarkan akun admin sekolah lo di sini</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" name="name" placeholder="Cth: Naruto Uzumaki" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" name="name" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Alamat Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" name="email" placeholder="nama@email.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password Baru</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" name="password" placeholder="Minimal 6 karakter" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-3 mb-3">
                        <i class="fa-solid fa-user-plus me-1"></i> Daftar Akun
                    </button>

                    <div class="text-center">
                        <small class="text-muted">Sudah punya akun admin? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold text-primary">Login di sini</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
