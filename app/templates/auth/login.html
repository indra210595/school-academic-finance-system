{% extends 'base.html' %}

{% block title %}Masuk Sistem - School App{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card shadow border-0 p-3 rounded-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">Selamat Datang 👋</h2>
                    <p class="text-muted small">Silakan login untuk masuk ke dashboard akademik</p>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" name="username" placeholder="username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <label class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-body-secondary border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-3 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk Sistem
                    </button>

<!--                    <div class="text-center">-->
<!--                        <small class="text-muted">Belum punya akun? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold text-primary">Daftar sekarang</a></small>-->
<!--                    </div>-->
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
